services:
  web:
    image: oven/bun:1
    working_dir: /app
    command: ["sh", "-ec", "bun install --frozen-lockfile && exec bun run dev"]
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    environment:
      # Vite >= 6.1 appends this to server.allowedHosts (value set by the platform)
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: on-failure
