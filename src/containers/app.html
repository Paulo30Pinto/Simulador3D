<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação de Motor Elétrico Assíncrono</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#5D5CDE',
                        secondary: '#4F46E5',
                        dark: {
                            bg: '#181818',
                            text: '#E5E7EB',
                            card: '#262626'
                        }
                    }
                }
            }
        }

        // Check for dark mode preference
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
    </script>
</head>

<body class="bg-white dark:bg-dark-bg text-gray-900 dark:text-dark-text transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        // Enum para estados da simulação
        const SimulationState = {
            INIT: 'Inicialização',
            WAITING: 'Aguardando Comando',
            STARTING: 'Arranque',
            RUNNING: 'Regime Permanente',
            STOPPING: 'Parada',
            CONFIGURING: 'Configuração'
        };

        // Parâmetros padrão do motor
        const defaultMotorParams = {
            ratedPower: 10, // kW
            ratedVoltage: 380, // V
            ratedFrequency: 50, // Hz
            ratedRPM: 1450, // rpm
            poles: 4,
            efficiency: 0.9, // 90%
            powerFactor: 0.85, // cos φ
            momentOfInertia: 0.05, // kg.m²
            startupTime: 5, // segundos
            loadTorque: 50, // N.m
        };

        // Componente principal da aplicação
        function App() {
            const [state, setState] = useState(SimulationState.INIT);
            const [motorParams, setMotorParams] = useState({ ...defaultMotorParams });
            const [motorData, setMotorData] = useState({
                rpm: 0,
                current: 0,
                torque: 0,
                powerFactor: 0,
                efficiency: 0,
                elapsedTime: 0,
            });
            const [validationError, setValidationError] = useState('');
            const [showParametersPanel, setShowParametersPanel] = useState(false);
            const [simulationActive, setSimulationActive] = useState(false);
            const [dataHistory, setDataHistory] = useState([]);

            const rpmChartRef = useRef(null);
            const currentChartRef = useRef(null);
            const rpmChart = useRef(null);
            const currentChart = useRef(null);
            const simulationInterval = useRef(null);

            // Inicializar simulação
            useEffect(() => {
                if (state === SimulationState.INIT) {
                    setMotorData({
                        rpm: 0,
                        current: 0,
                        torque: 0,
                        powerFactor: 0,
                        efficiency: 0,
                        elapsedTime: 0,
                    });

                    setState(SimulationState.WAITING);
                }
            }, [state]);

            // Configurar os gráficos quando componente montar
            useEffect(() => {
                initializeCharts();

                return () => {
                    if (rpmChart.current) {
                        rpmChart.current.destroy();
                    }
                    if (currentChart.current) {
                        currentChart.current.destroy();
                    }
                };
            }, []);

            // Inicializar os gráficos
            const initializeCharts = () => {
                if (rpmChartRef.current && currentChartRef.current) {
                    const isDarkMode = document.documentElement.classList.contains('dark');
                    const gridColor = isDarkMode ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
                    const textColor = isDarkMode ? '#E5E7EB' : '#374151';

                    // Criar gráfico RPM
                    if (rpmChart.current) {
                        rpmChart.current.destroy();
                    }

                    rpmChart.current = new Chart(rpmChartRef.current, {
                        type: 'line',
                        data: {
                            labels: [],
                            datasets: [{
                                label: 'RPM',
                                data: [],
                                borderColor: '#5D5CDE',
                                tension: 0.2,
                                fill: false
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                x: {
                                    title: {
                                        display: true,
                                        text: 'Tempo (s)',
                                        color: textColor
                                    },
                                    grid: {
                                        color: gridColor
                                    },
                                    ticks: {
                                        color: textColor
                                    }
                                },
                                y: {
                                    title: {
                                        display: true,
                                        text: 'RPM',
                                        color: textColor
                                    },
                                    grid: {
                                        color: gridColor
                                    },
                                    ticks: {
                                        color: textColor
                                    }
                                }
                            },
                            plugins: {
                                legend: {
                                    labels: {
                                        color: textColor
                                    }
                                }
                            }
                        }
                    });

                    // Criar gráfico de corrente
                    if (currentChart.current) {
                        currentChart.current.destroy();
                    }

                    currentChart.current = new Chart(currentChartRef.current, {
                        type: 'line',
                        data: {
                            labels: [],
                            datasets: [{
                                label: 'Corrente (A)',
                                data: [],
                                borderColor: '#4F46E5',
                                tension: 0.2,
                                fill: false
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                x: {
                                    title: {
                                        display: true,
                                        text: 'Tempo (s)',
                                        color: textColor
                                    },
                                    grid: {
                                        color: gridColor
                                    },
                                    ticks: {
                                        color: textColor
                                    }
                                },
                                y: {
                                    title: {
                                        display: true,
                                        text: 'Corrente (A)',
                                        color: textColor
                                    },
                                    grid: {
                                        color: gridColor
                                    },
                                    ticks: {
                                        color: textColor
                                    }
                                }
                            },
                            plugins: {
                                legend: {
                                    labels: {
                                        color: textColor
                                    }
                                }
                            }
                        }
                    });
                }
            };

            // Atualizar gráficos quando o tema mudar
            useEffect(() => {
                const darkModeObserver = new MutationObserver((mutations) => {
                    mutations.forEach((mutation) => {
                        if (mutation.attributeName === 'class') {
                            initializeCharts();
                        }
                    });
                });

                darkModeObserver.observe(document.documentElement, { attributes: true });

                return () => darkModeObserver.disconnect();
            }, []);

            // Atualizar gráficos com novos dados
            useEffect(() => {
                if (rpmChart.current && currentChart.current && motorData.elapsedTime > 0) {
                    // Adicionar dados ao gráfico RPM
                    rpmChart.current.data.labels.push(motorData.elapsedTime.toFixed(1));
                    rpmChart.current.data.datasets[0].data.push(motorData.rpm);

                    // Limitar pontos de dados a 100
                    if (rpmChart.current.data.labels.length > 100) {
                        rpmChart.current.data.labels.shift();
                        rpmChart.current.data.datasets[0].data.shift();
                    }

                    // Adicionar dados ao gráfico de corrente
                    currentChart.current.data.labels.push(motorData.elapsedTime.toFixed(1));
                    currentChart.current.data.datasets[0].data.push(motorData.current);

                    // Limitar pontos de dados a 100
                    if (currentChart.current.data.labels.length > 100) {
                        currentChart.current.data.labels.shift();
                        currentChart.current.data.datasets[0].data.shift();
                    }

                    rpmChart.current.update();
                    currentChart.current.update();
                }
            }, [motorData]);

            // Iniciar o motor
            const startMotor = () => {
                setState(SimulationState.STARTING);
                setSimulationActive(true);

                // Limpar os gráficos
                if (rpmChart.current && currentChart.current) {
                    rpmChart.current.data.labels = [];
                    rpmChart.current.data.datasets[0].data = [];
                    currentChart.current.data.labels = [];
                    currentChart.current.data.datasets[0].data = [];
                    rpmChart.current.update();
                    currentChart.current.update();
                }

                // Resetar dados do motor
                setMotorData({
                    rpm: 0,
                    current: 0,
                    torque: 0,
                    powerFactor: 0,
                    efficiency: 0,
                    elapsedTime: 0,
                });

                setDataHistory([]);

                // Iniciar simulação
                let startTime = Date.now();
                let lastUpdate = startTime;

                if (simulationInterval.current) {
                    clearInterval(simulationInterval.current);
                }

                simulationInterval.current = setInterval(() => {
                    const currentTime = Date.now();
                    const deltaTime = (currentTime - lastUpdate) / 1000; // Tempo em segundos
                    lastUpdate = currentTime;

                    const elapsedTime = (currentTime - startTime) / 1000;

                    setMotorData(prevData => {
                        // Cálculo do RPM baseado no tempo de partida
                        let newRPM;
                        let newCurrent;
                        let newTorque;
                        let newPowerFactor;
                        let newEfficiency;

                        if (elapsedTime < motorParams.startupTime) {
                            // Durante a partida (rampa de aceleração)
                            const rampProgress = elapsedTime / motorParams.startupTime;
                            newRPM = motorParams.ratedRPM * rampProgress;

                            // Simulação de corrente de partida (tipicamente 5-7x a corrente nominal)
                            const ratedCurrent = motorParams.ratedPower * 1000 /
                                (Math.sqrt(3) * motorParams.ratedVoltage * motorParams.powerFactor * motorParams.efficiency);
                            const startingCurrentFactor = 6 * (1 - rampProgress) + 1; // Diminui de 6x para 1x
                            newCurrent = ratedCurrent * startingCurrentFactor;

                            // Torque de partida (crescente até o nominal)
                            newTorque = motorParams.loadTorque * (0.5 + 0.5 * rampProgress);

                            // Fator de potência durante partida (tipicamente menor)
                            newPowerFactor = motorParams.powerFactor * (0.6 + 0.4 * rampProgress);

                            // Eficiência durante partida (tipicamente menor)
                            newEfficiency = motorParams.efficiency * (0.5 + 0.5 * rampProgress);
                        } else {
                            // Em regime permanente
                            if (prevData.rpm < 0.95 * motorParams.ratedRPM) {
                                setState(SimulationState.RUNNING);
                            }

                            // Calcular RPM com pequenas oscilações para simular cargas
                            const oscillation = Math.sin(elapsedTime) * 5; // Oscilação de ±5 RPM
                            newRPM = motorParams.ratedRPM + oscillation;

                            // Corrente nominal com pequenas variações
                            const ratedCurrent = motorParams.ratedPower * 1000 /
                                (Math.sqrt(3) * motorParams.ratedVoltage * motorParams.powerFactor * motorParams.efficiency);
                            const currentOscillation = Math.sin(elapsedTime * 1.5) * 0.05 * ratedCurrent; // Oscilação de ±5%
                            newCurrent = ratedCurrent + currentOscillation;

                            // Torque em regime
                            const torqueOscillation = Math.sin(elapsedTime * 2) * 0.03 * motorParams.loadTorque; // Oscilação de ±3%
                            newTorque = motorParams.loadTorque + torqueOscillation;

                            // Fator de potência e eficiência em regime
                            newPowerFactor = motorParams.powerFactor;
                            newEfficiency = motorParams.efficiency;
                        }

                        // Armazenar dados históricos para análise
                        if (elapsedTime % 0.5 < deltaTime) { // Aproximadamente a cada 0.5 segundos
                            setDataHistory(prev => [...prev, {
                                time: elapsedTime,
                                rpm: newRPM,
                                current: newCurrent,
                                torque: newTorque,
                                powerFactor: newPowerFactor,
                                efficiency: newEfficiency
                            }]);
                        }

                        return {
                            rpm: newRPM,
                            current: newCurrent,
                            torque: newTorque,
                            powerFactor: newPowerFactor,
                            efficiency: newEfficiency,
                            elapsedTime: elapsedTime
                        };
                    });
                }, 100); // Atualizar a cada 100ms
            };

            // Parar o motor
            const stopMotor = () => {
                setState(SimulationState.STOPPING);
                setSimulationActive(false);

                if (simulationInterval.current) {
                    clearInterval(simulationInterval.current);
                }

                // Simular desaceleração
                let startStopTime = Date.now();
                let lastUpdate = startStopTime;
                const initialRPM = motorData.rpm;
                const stopTime = motorParams.startupTime * 0.7; // Tempo de parada geralmente é menor que o de partida

                simulationInterval.current = setInterval(() => {
                    const currentTime = Date.now();
                    const deltaTime = (currentTime - lastUpdate) / 1000;
                    lastUpdate = currentTime;

                    const elapsedStopTime = (currentTime - startStopTime) / 1000;

                    if (elapsedStopTime >= stopTime) {
                        // Motor parado
                        clearInterval(simulationInterval.current);
                        setMotorData(prev => ({
                            ...prev,
                            rpm: 0,
                            current: 0,
                            torque: 0,
                            powerFactor: 0,
                            efficiency: 0,
                        }));
                        setState(SimulationState.WAITING);
                    } else {
                        // Desaceleração linear
                        const rampProgress = elapsedStopTime / stopTime;
                        const newRPM = initialRPM * (1 - rampProgress);

                        // Corrente durante parada (diminui)
                        const ratedCurrent = motorParams.ratedPower * 1000 /
                            (Math.sqrt(3) * motorParams.ratedVoltage * motorParams.powerFactor * motorParams.efficiency);
                        const newCurrent = ratedCurrent * (1 - rampProgress);

                        // Diminuir torque proporcionalmente
                        const newTorque = motorParams.loadTorque * (1 - rampProgress);

                        setMotorData(prev => ({
                            ...prev,
                            rpm: newRPM,
                            current: newCurrent,
                            torque: newTorque,
                            powerFactor: motorParams.powerFactor * (1 - 0.5 * rampProgress),
                            efficiency: motorParams.efficiency * (1 - 0.5 * rampProgress),
                            elapsedTime: prev.elapsedTime + deltaTime
                        }));

                        // Atualizar histórico
                        if (elapsedStopTime % 0.5 < deltaTime) {
                            setDataHistory(prev => [...prev, {
                                time: motorData.elapsedTime + deltaTime,
                                rpm: newRPM,
                                current: newCurrent,
                                torque: newTorque,
                                powerFactor: motorParams.powerFactor * (1 - 0.5 * rampProgress),
                                efficiency: motorParams.efficiency * (1 - 0.5 * rampProgress)
                            }]);
                        }
                    }
                }, 100);
            };

            // Validar parâmetros atualizados
            const validateParameters = (params) => {
                if (params.ratedPower <= 0) return "Potência nominal deve ser maior que zero";
                if (params.ratedVoltage <= 0) return "Tensão nominal deve ser maior que zero";
                if (params.ratedFrequency <= 0) return "Frequência nominal deve ser maior que zero";
                if (params.ratedRPM <= 0) return "RPM nominal deve ser maior que zero";
                if (params.poles <= 0 || params.poles % 2 !== 0) return "Número de polos deve ser par e maior que zero";
                if (params.efficiency <= 0 || params.efficiency > 1) return "Eficiência deve estar entre 0 e 1";
                if (params.powerFactor <= 0 || params.powerFactor > 1) return "Fator de potência deve estar entre 0 e 1";
                if (params.momentOfInertia <= 0) return "Momento de inércia deve ser maior que zero";
                if (params.startupTime <= 0) return "Tempo de partida deve ser maior que zero";
                if (params.loadTorque <= 0) return "Torque de carga deve ser maior que zero";
                return "";
            };

            // Atualizar parâmetros
            const updateParameters = () => {
                setState(SimulationState.CONFIGURING);
                const validationResult = validateParameters(motorParams);

                if (validationResult === "") {
                    setValidationError("");
                    setShowParametersPanel(false);
                    setState(SimulationState.WAITING);
                } else {
                    setValidationError(validationResult);
                }
            };

            // Gerenciar mudança de parâmetros
            const handleParameterChange = (e) => {
                const { name, value } = e.target;
                setMotorParams(prev => ({
                    ...prev,
                    [name]: parseFloat(value)
                }));
            };

            // Formatação de valores com 2 casas decimais
            const formatValue = (value) => {
                return value.toFixed(2);
            };

            return (
                <div className="container mx-auto px-4 py-6">
                    <h1 className="text-3xl font-bold text-center mb-6 text-primary">Simulação de Motor Elétrico Assíncrono</h1>

                    {/* Estado atual */}
                    <div className="mb-6 text-center">
                        <div className="inline-block px-4 py-2 rounded-lg bg-primary bg-opacity-10 dark:bg-opacity-20">
                            <p className="font-medium">Estado: <span className="font-bold">{state}</span></p>
                        </div>
                    </div>

                    {/* Painel de controle */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
                        {/* Controles */}
                        <div className="bg-white dark:bg-dark-card rounded-xl shadow-md p-6">
                            <h2 className="text-xl font-bold mb-4">Controles</h2>
                            <div className="space-y-4">
                                <button
                                    onClick={startMotor}
                                    disabled={simulationActive || state === SimulationState.CONFIGURING}
                                    className="w-full py-2 px-4 bg-primary hover:bg-secondary text-white font-medium rounded-md transition disabled:opacity-50 disabled:cursor-not-allowed">
                                    Arranque do Motor
                                </button>

                                <button
                                    onClick={stopMotor}
                                    disabled={!simulationActive || state === SimulationState.STOPPING}
                                    className="w-full py-2 px-4 bg-red-500 hover:bg-red-600 text-white font-medium rounded-md transition disabled:opacity-50 disabled:cursor-not-allowed">
                                    Parada do Motor
                                </button>

                                <button
                                    onClick={() => setShowParametersPanel(true)}
                                    disabled={simulationActive}
                                    className="w-full py-2 px-4 bg-gray-500 hover:bg-gray-600 dark:bg-gray-700 dark:hover:bg-gray-600 text-white font-medium rounded-md transition disabled:opacity-50 disabled:cursor-not-allowed">
                                    Ajuste de Parâmetros
                                </button>
                            </div>
                        </div>

                        {/* Parâmetros Elétricos */}
                        <div className="bg-white dark:bg-dark-card rounded-xl shadow-md p-6">
                            <h2 className="text-xl font-bold mb-4">Parâmetros Elétricos</h2>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <p className="text-sm font-medium text-gray-600 dark:text-gray-400">Potência</p>
                                    <p className="font-bold">{motorParams.ratedPower} kW</p>
                                </div>
                                <div>
                                    <p className="text-sm font-medium text-gray-600 dark:text-gray-400">Tensão</p>
                                    <p className="font-bold">{motorParams.ratedVoltage} V</p>
                                </div>
                                <div>
                                    <p className="text-sm font-medium text-gray-600 dark:text-gray-400">Frequência</p>
                                    <p className="font-bold">{motorParams.ratedFrequency} Hz</p>
                                </div>
                                <div>
                                    <p className="text-sm font-medium text-gray-600 dark:text-gray-400">Fator de Potência</p>
                                    <p className="font-bold">{formatValue(motorData.powerFactor)}</p>
                                </div>
                                <div>
                                    <p className="text-sm font-medium text-gray-600 dark:text-gray-400">Corrente</p>
                                    <p className="font-bold">{formatValue(motorData.current)} A</p>
                                </div>
                                <div>
                                    <p className="text-sm font-medium text-gray-600 dark:text-gray-400">Eficiência</p>
                                    <p className="font-bold">{formatValue(motorData.efficiency * 100)}%</p>
                                </div>
                            </div>
                        </div>

                        {/* Parâmetros Mecânicos */}
                        <div className="bg-white dark:bg-dark-card rounded-xl shadow-md p-6">
                            <h2 className="text-xl font-bold mb-4">Parâmetros Mecânicos</h2>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <p className="text-sm font-medium text-gray-600 dark:text-gray-400">RPM Atual</p>
                                    <p className="font-bold">{formatValue(motorData.rpm)}</p>
                                </div>
                                <div>
                                    <p className="text-sm font-medium text-gray-600 dark:text-gray-400">RPM Nominal</p>
                                    <p className="font-bold">{motorParams.ratedRPM}</p>
                                </div>
                                <div>
                                    <p className="text-sm font-medium text-gray-600 dark:text-gray-400">Torque</p>
                                    <p className="font-bold">{formatValue(motorData.torque)} N.m</p>
                                </div>
                                <div>
                                    <p className="text-sm font-medium text-gray-600 dark:text-gray-400">Polos</p>
                                    <p className="font-bold">{motorParams.poles}</p>
                                </div>
                                <div>
                                    <p className="text-sm font-medium text-gray-600 dark:text-gray-400">Tempo Decorrido</p>
                                    <p className="font-bold">{formatValue(motorData.elapsedTime)} s</p>
                                </div>
                                <div>
                                    <p className="text-sm font-medium text-gray-600 dark:text-gray-400">Estado</p>
                                    <p className="font-bold">
                                        {motorData.rpm >= 0.95 * motorParams.ratedRPM ? 'Regime' :
                                            motorData.rpm > 0 ? 'Transitório' : 'Parado'}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Gráficos */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                        <div className="bg-white dark:bg-dark-card rounded-xl shadow-md p-6">
                            <h2 className="text-xl font-bold mb-4">RPM</h2>
                            <div className="h-60">
                                <canvas ref={rpmChartRef}></canvas>
                            </div>
                        </div>

                        <div className="bg-white dark:bg-dark-card rounded-xl shadow-md p-6">
                            <h2 className="text-xl font-bold mb-4">Corrente</h2>
                            <div className="h-60">
                                <canvas ref={currentChartRef}></canvas>
                            </div>
                        </div>
                    </div>

                    {/* Progresso */}
                    {state === SimulationState.STARTING && (
                        <div className="bg-white dark:bg-dark-card rounded-xl shadow-md p-6 mb-6">
                            <h2 className="text-xl font-bold mb-4">Processo de Partida</h2>
                            <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-4 mb-2">
                                <div
                                    className="bg-primary h-4 rounded-full transition-all"
                                    style={{ width: `${Math.min(100, (motorData.rpm / (0.95 * motorParams.ratedRPM)) * 100)}%` }}>
                                </div>
                            </div>
                            <p className="text-center">
                                {motorData.rpm >= 0.95 * motorParams.ratedRPM ?
                                    'Regime permanente atingido' :
                                    `${formatValue((motorData.rpm / (0.95 * motorParams.ratedRPM)) * 100)}% do regime permanente`}
                            </p>
                        </div>
                    )}

                    {/* Modal de Parâmetros */}
                    {showParametersPanel && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white dark:bg-dark-card rounded-xl shadow-lg p-6 w-full max-w-lg">
                                <h2 className="text-xl font-bold mb-4">Ajuste de Parâmetros</h2>

                                {validationError && (
                                    <div className="bg-red-100 dark:bg-red-900 dark:bg-opacity-20 border border-red-400 text-red-700 dark:text-red-300 px-4 py-3 rounded mb-4">
                                        <p>{validationError}</p>
                                    </div>
                                )}

                                <div className="grid grid-cols-2 gap-4 mb-6">
                                    <div>
                                        <label className="block text-sm font-medium mb-1">Potência (kW)</label>
                                        <input
                                            type="number"
                                            name="ratedPower"
                                            value={motorParams.ratedPower}
                                            onChange={handleParameterChange}
                                            className="w-full p-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-base">
                                        </input>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium mb-1">Tensão (V)</label>
                                        <input
                                            type="number"
                                            name="ratedVoltage"
                                            value={motorParams.ratedVoltage}
                                            onChange={handleParameterChange}
                                            className="w-full p-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-base">
                                        </input>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium mb-1">Frequência (Hz)</label>
                                        <input
                                            type="number"
                                            name="ratedFrequency"
                                            value={motorParams.ratedFrequency}
                                            onChange={handleParameterChange}
                                            className="w-full p-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-base">
                                        </input>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium mb-1">RPM Nominal</label>
                                        <input
                                            type="number"
                                            name="ratedRPM"
                                            value={motorParams.ratedRPM}
                                            onChange={handleParameterChange}
                                            className="w-full p-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-base">
                                        </input>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium mb-1">Polos</label>
                                        <input
                                            type="number"
                                            name="poles"
                                            value={motorParams.poles}
                                            onChange={handleParameterChange}
                                            className="w-full p-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-base">
                                        </input>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium mb-1">Eficiência (0-1)</label>
                                        <input
                                            type="number"
                                            name="efficiency"
                                            value={motorParams.efficiency}
                                            onChange={handleParameterChange}
                                            min="0"
                                            max="1"
                                            step="0.01"
                                            className="w-full p-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-base">
                                        </input>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium mb-1">Fator de Potência (0-1)</label>
                                        <input
                                            type="number"
                                            name="powerFactor"
                                            value={motorParams.powerFactor}
                                            onChange={handleParameterChange}
                                            min="0"
                                            max="1"
                                            step="0.01"
                                            className="w-full p-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-base">
                                        </input>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium mb-1">Momento de Inércia (kg.m²)</label>
                                        <input
                                            type="number"
                                            name="momentOfInertia"
                                            value={motorParams.momentOfInertia}
                                            onChange={handleParameterChange}
                                            min="0"
                                            step="0.01"
                                            className="w-full p-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-base">
                                        </input>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium mb-1">Tempo de Partida (s)</label>
                                        <input
                                            type="number"
                                            name="startupTime"
                                            value={motorParams.startupTime}
                                            onChange={handleParameterChange}
                                            min="0"
                                            step="0.1"
                                            className="w-full p-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-base">
                                        </input>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium mb-1">Torque de Carga (N.m)</label>
                                        <input
                                            type="number"
                                            name="loadTorque"
                                            value={motorParams.loadTorque}
                                            onChange={handleParameterChange}
                                            min="0"
                                            step="0.1"
                                            className="w-full p-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-base">
                                        </input>
                                    </div>
                                </div>

                                <div className="flex space-x-4">
                                    <button
                                        onClick={updateParameters}
                                        className="flex-1 py-2 px-4 bg-primary hover:bg-secondary text-white font-medium rounded-md transition">
                                        Salvar
                                    </button>

                                    <button
                                        onClick={() => {
                                            setShowParametersPanel(false);
                                            setValidationError("");
                                        }}
                                        className="flex-1 py-2 px-4 bg-gray-500 hover:bg-gray-600 dark:bg-gray-700 dark:hover:bg-gray-600 text-white font-medium rounded-md transition">
                                        Cancelar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Renderizar aplicação
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
