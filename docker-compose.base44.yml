services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      # Vite >= 6.1 appends this to its allowedHosts so the preview origin is accepted.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
